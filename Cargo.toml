[package]
name = "guitar"
version = "0.1.0"
edition = "2021"
description = "Pitch monitor for tuning a guitar and singing"

[dependencies]
anyhow = "1"
gpui = { version = "0.2", default-features = false, features = ["wayland"] }
pipewire = { version = "0.10", features = ["v0_3_49"] }  # Buffer::requested, for low-latency playback
realfft = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
